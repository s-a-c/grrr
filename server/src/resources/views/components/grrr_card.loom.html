---
import database/main/models/grrr/gen/grrr.{type Grrr}

props(grrr: Grrr)
---

<article class="rounded-xl border border-[#45475a] bg-[#181825] p-4 shadow-md">
  <div class="flex items-center justify-between gap-3 text-sm">
    <span class="font-mono font-bold text-[#f5c2e7]">{{ grrr.author_handle }}</span>
    <time class="font-mono text-xs text-[#b4bcd8]">{{ grrr.created_at }}</time>
  </div>
  <p class="mt-2 text-[#cdd6f4] leading-relaxed">{{ grrr.body }}</p>
  <div class="mt-3 text-xs font-mono text-[#89b4fa]">uuid: {{ grrr.uuid }}</div>
  <x-grrr_actions
    :uuid="grrr.uuid"
    :deleted="False"
    :confirming="False">
  </x-grrr_actions>
</article>
